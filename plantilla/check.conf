# Checks of this repo (unho-hq/ci). The format:
#   version            = the CI version (moving tag v1: fixes arrive by themselves)
#   integrados         = shared checks from unho-hq/ci/checks
#   rapido.<nombre>    = a command that every PR runs (aim: under 1 minute in total)
#   completo.<nombre>  = a command that only runs after merging; it gates production
version = v1
integrados = sin-bom sin-secretos env-example autoria unho-yaml
rapido.pruebas = pnpm test
completo.build = pnpm build
