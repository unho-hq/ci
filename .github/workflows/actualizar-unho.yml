# Reusable workflow: brings @unho/* to the newest version of the same major in the calling repo.
# Every app calls it every hour from its own actualizar-unho.yml.
#
# - Nothing new: ends in seconds.
# - Something new: updates package.json and the lock, runs the FULL check (same as after a merge)
#   and only if everything is green pushes the commit to main.
# - Then, if the repo is an app (unho.yaml and Dockerfile), it builds that commit's image here:
#   a push made by a workflow does not start the repo's other workflows (GitHub's rule), so without
#   this step Ops would never get an image to put in development (map §5.4, layer 3).
# - Red: leaves the branch unho/actualizar with the change and fails, so it shows in Actions.
#
# GitHub (free plan) does not let workflows open PRs in this organisation, so the gate is the
# full check run here before pushing, instead of a PR's CI.
name: actualizar-unho

on:
  workflow_call:
    inputs:
      directorio:
        description: Folder with the app's package.json, check.sh and unho.yaml, when it is not the repo root (e.g. consola)
        type: string
        default: "."

permissions:
  contents: write

concurrency:
  group: actualizar-unho-${{ github.repository }}
  cancel-in-progress: false

jobs:
  actualizar:
    name: actualizar @unho
    runs-on: [self-hosted, pop-os]
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ${{ inputs.directorio }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: unho-hq/ci
          ref: v1
          path: .unho-ci
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: ¿Hay versión nueva?
        id: plan
        run: |
          echo ".unho-ci/" >> "$GITHUB_WORKSPACE/.git/info/exclude"
          node "$GITHUB_WORKSPACE/.unho-ci/bin/actualizar-unho.mjs" --escribir
      - name: Instalar
        if: steps.plan.outputs.cambios == 'true'
        run: npm install --no-audit --no-fund
      - name: CI completo
        id: check
        if: steps.plan.outputs.cambios == 'true'
        env:
          UNHO_CI_BASE: origin/main
        run: bash ./check.sh
      - name: Subir a main
        id: subir
        if: steps.plan.outputs.cambios == 'true' && steps.check.outcome == 'success'
        env:
          MENSAJE: ${{ steps.plan.outputs.mensaje }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -q -m "$MENSAJE" -m "Automatic: same major, full CI green on pop-os."
          git push origin HEAD:main
          git push -q origin --delete unho/actualizar 2>/dev/null || true
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "### ✓ $MENSAJE" >> "$GITHUB_STEP_SUMMARY"
      - name: Imagen del commit subido
        if: steps.subir.outcome == 'success'
        env:
          REGISTRO: 127.0.0.1:5000
          COMMIT: ${{ steps.subir.outputs.commit }}
        run: |
          # Only apps have an image (the libraries do not).
          if [ ! -f unho.yaml ] || [ ! -f Dockerfile ]; then echo "Sin unho.yaml o Dockerfile: no es una app, no hay imagen."; exit 0; fi
          # The same build as imagen.yml, for this commit. The CI checkout is not part of the image.
          rm -rf "$GITHUB_WORKSPACE/.unho-ci"
          app="$(sed -n 's/^app:[[:space:]]*\([a-z][a-z0-9-]*\).*/\1/p' unho.yaml | head -1)"
          [ -n "$app" ] || { echo "unho.yaml no dice app:"; exit 2; }
          etiqueta="$REGISTRO/$app:$COMMIT"
          docker build --network host --label "unho.app=$app" --label "unho.commit=$COMMIT" --label "unho.rama=main" -t "$etiqueta" .
          docker push -q "$etiqueta"
          imagen="$(docker image inspect --format '{{index .RepoDigests 0}}' "$etiqueta")"
          echo "### Imagen: \`$imagen\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Dejar la rama si el CI falla
        if: failure() && steps.plan.outputs.cambios == 'true' && steps.subir.outcome != 'success'
        env:
          MENSAJE: ${{ steps.plan.outputs.mensaje }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c unho/actualizar
          git add -u
          git commit -q -m "$MENSAJE" -m "Automatic: the full CI failed; not pushed to main."
          git push -f origin unho/actualizar
          echo "### ✗ $MENSAJE: el CI completo falla. Rama unho/actualizar con el cambio." >> "$GITHUB_STEP_SUMMARY"
